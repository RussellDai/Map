<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>常州购房地图 · 生活圈与购房规划</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'">
<link rel="stylesheet" href="css/style.css?v=26">
</head>
<body>
<header id="topbar">
  <div class="brand">🏠 常州购房地图</div>
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="搜索小区 / 地名（如：湖塘、礼河、万科）" autocomplete="off">
    <button id="searchBtn">搜索</button>
    <div id="searchResults" class="search-results hidden"></div>
  </div>
  <div class="actions">
    <button id="addModeBtn" class="btn" title="开启后点击地图任意位置手动添加小区">➕ 手动标记小区</button>
    <button id="routeBtn" class="btn" title="依次点击地图（或已有小区点）选择起点和终点，规划驾车路线">🧭 路线导航</button>
    <button id="syncBtn" class="btn" title="绑定 Gitee/GitHub 账号，跨设备自动同步清单与圆圈">☁ 同步</button>
    <button id="exportBtn" class="btn" title="导出已保存的小区信息与圆心位置">⬇ 导出</button>
    <button id="importBtn" class="btn" title="从 JSON 文件恢复数据">⬆ 导入</button>
    <input type="file" id="importFile" accept=".json,application/json" class="hidden">
  </div>
</header>
<div id="main">
  <aside id="sidebar">
    <div class="sidebar-head">
      <h2>我的小区清单 <span id="countBadge">0</span></h2>
    <button id="sidebarToggle" class="btn small" title="收起/展开清单">▾</button>
      <button id="circleSettingsBtn" class="btn small" title="自定义圆心位置与半径">⚙ 圆圈设置</button>
    </div>
    <div id="circleSettings" class="circle-settings hidden"></div>
    <div class="filters">
      <span id="circleFilters"></span>
      <select id="fltLevel" title="按分级筛选">
        <option value="">全部等级</option>
        <option value="focus">🔴 重点关注</option>
        <option value="backup">🔵 备选</option>
        <option value="exclude">⚫ 排除</option>
        <option value="none">未分级</option>
      </select>
    </div>
    <div id="communityList" class="community-list"></div>
    <div class="sidebar-foot">
      <div class="legend">
        <span><span class="dot" style="background:#94a3b8"></span>未填信息</span>
        <span><span class="dot" style="background:#10b981"></span>已填信息</span>
        <span><span class="dot ring" style="border-color:#dc2626"></span>重点关注</span>
        <span><span class="dot ring" style="border-color:#2563eb"></span>备选</span>
        <span><span class="dot ring dash" style="border-color:#64748b"></span>排除</span>
        <span id="legendCircles"></span>
      </div>
      <p class="tip">💡 悬停看信息（含到各圆心车程），点击填写；🧭 路线导航规划两点驾车路线；⚙ 圆圈设置可增删圆圈、改名改半径、拖拽圆心；分级不改底色（红圈=重点关注 / 蓝圈=备选 / 灰虚圈=排除）；🌐 街景、🏙 3D实景。</p>
    </div>
  </aside>
  <div id="map">
    <!-- 路线导航面板（路线模式下显示；置于地图容器内，移动端自适应宽度） -->
    <div id="routePanel" class="route-panel hidden">
      <div class="route-title">🧭 路线导航 <span class="route-hint">点击地图或已有小区点设置起终点</span></div>
      <div id="routeStatus" class="route-status">点击地图选择起点</div>
      <div class="route-btns">
        <button type="button" id="routeSwap" class="btn">⇄ 交换起终点</button>
        <button type="button" id="routeClear" class="btn">🗑 清除路线</button>
        <button type="button" id="routeExit" class="btn">✖ 退出导航</button>
      </div>
    </div>
  </div>
</div>
<div id="statusBar" class="hidden"></div>
<div id="syncPanel" class="sync-panel hidden"></div>
<div id="toast" class="hidden"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>window.L||document.write('<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"><\/script>')</script>
<script src="js/gcoord.js?v=26"></script>
<script src="js/config.js?v=26"></script>
<script src="js/store.js?v=26"></script>
<script src="js/overpass.js?v=26"></script>
<script src="js/ui.js?v=26"></script>
<script src="js/amap3d.js?v=26"></script>
<script src="js/drive.js?v=26"></script>
<script src="js/route.js?v=26"></script>
<script src="js/sync.js?v=26"></script>
<script src="js/app.js?v=26"></script>
</body>
</html>
